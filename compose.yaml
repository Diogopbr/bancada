services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: bancada
      POSTGRES_USER: bancada
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally}
    ports:
      - "127.0.0.1:55417:5432"
    volumes:
      - bancada-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bancada -d bancada"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  bancada-data:
